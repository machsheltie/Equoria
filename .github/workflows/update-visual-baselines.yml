name: 'Update Visual Baselines'

# Manually triggered to (re-)generate Playwright toHaveScreenshot baselines on
# the ubuntu-latest + chromium stack that matches normal CI.  After this job
# pushes the snapshots, remove any test.fixme guards from the spec and commit
# that separately so the tests become first-class CI checks.
#
# Usage:
#   GitHub UI → Actions → "Update Visual Baselines" → Run workflow
#   Optionally override `spec` to target a different spec file.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file path (relative to repo root)'
        required: false
        default: 'tests/e2e/glass-panel-surface.spec.ts'

permissions:
  contents: write

env:
  NODE_VERSION: '22.x'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/equoria_test'
  JWT_SECRET: 'Test-JWT-Secret-For-CI-Minimum-32-Chars-Long-A1'
  JWT_REFRESH_SECRET: 'Test-Refresh-Secret-For-CI-Minimum-32-Chars-B2'
  # beta matches the NODE_ENV the backend server uses in playwright.config.ts
  # webServer command (PORT=3001 NODE_ENV=beta node backend/server.mjs)
  NODE_ENV: 'beta'
  # config/config.mjs:44 lists PORT among the always-required vars and throws
  # when it is missing. Under NODE_ENV=beta it loads backend/env.beta, falling
  # back to backend/env.test — and NEITHER file is tracked, so on a CI runner
  # nothing supplies PORT and every step that imports config dies before doing
  # any work. That is what failed the 2026-09-22 dispatch of this workflow at
  # `npm run seed`: "Problematic required environment variables for beta
  # environment: PORT (is missing)". Same root cause as the Equoria-fefh2
  # recovery documented at test.yml:123. The steps that boot the server get
  # PORT from the playwright.config.ts webServer command; the seed step has no
  # such wrapper, so the value has to come from here. 3001 matches webServer.
  PORT: '3001'

jobs:
  update-baselines:
    name: 'Generate Linux/chromium Baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Equoria-pb4sw: this job runs the backend at NODE_ENV=beta (see the
      # playwright.config.ts webServer command), which takes the REAL
      # rate-limit middleware path backed by Redis. Without a Redis service the
      # limiter never connects: the 2026-09-22 dispatch (run 35716891335) spent
      # its whole window in "[Redis] Reconnection attempt N, waiting 500ms" —
      # 58+ attempts — and global-setup.ts then failed to register its user,
      # "page.waitForURL: Timeout 30000ms exceeded". No screenshot is taken if
      # global setup never completes.
      #
      # This mirrors the e2e-tests job in test.yml, whose own comment records
      # that Redis is the only correct fix here: bypass headers are explicitly
      # disabled under NODE_ENV=beta (rateLimiting.mjs, Story 21S-2) and the
      # TEST_RATE_LIMIT_MAX_REQUESTS knobs only apply under NODE_ENV=test.
      #
      # No E2E_RATE_LIMIT_MAX override is set: that job needs one because its
      # ~130 specs run ~27 min from a single CI IP, while this job runs one
      # spec and takes three screenshots, which is nowhere near the beta cap.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
        with:
          # Use a PAT from an admin account so the final git push can bypass the
          # 24 required-status-checks branch protection rules (enforce_admins:false).
          # GITHUB_TOKEN is the actions bot (not an admin) and gets rejected.
          # Create BASELINE_PUSH_PAT as a repo secret: classic PAT with repo scope.
          token: ${{ secrets.BASELINE_PUSH_PAT || github.token }}

      - name: 'Setup Node.js'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            packages/database/package-lock.json

      - name: 'Install Dependencies'
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../packages/database && npm ci

      - name: 'Setup Database'
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: 'Seed Breeds (required for onboarding in global-setup)'
        # global-setup.ts registers a user and completes onboarding, which
        # calls breedSelect.selectOption({ index: 1 }). Without seed data the
        # dropdown only has its placeholder and the setup times out.
        # `npm run seed` inserts the 5 canonical breeds in ~5s.
        working-directory: ./backend
        run: npm run seed

      - name: 'Cache Playwright Browsers'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 'Install Playwright Browsers (chromium only)'
        run: npx playwright install --with-deps chromium

      - name: 'Remove test.fixme markers for baseline generation'
        # test.fixme() causes Playwright to skip the test body entirely — no
        # screenshot is ever taken, so --update-snapshots produces nothing.
        # Temporarily promote fixme → test so the screenshot body runs and
        # generates the PNG baselines.  The spec is committed in the next step
        # so the markers stay removed in the repo (they were only there because
        # baselines didn't exist yet).
        run: |
          SPEC="${{ github.event.inputs.spec || 'tests/e2e/glass-panel-surface.spec.ts' }}"
          sed -i 's/test\.fixme(/test(/g' "$SPEC"
          echo "Removed test.fixme markers from $SPEC"
          grep -n "test\.fixme" "$SPEC" || echo "(no remaining test.fixme markers)"

      - name: 'Generate Screenshot Baselines'
        # CI=true makes webServer start fresh servers (reuseExistingServer:false)
        # and sets workers:1, retries:2.
        run: |
          npx playwright test "${{ github.event.inputs.spec || 'tests/e2e/glass-panel-surface.spec.ts' }}" \
            --update-snapshots \
            --project=chromium
        env:
          CI: 'true'

      - name: 'Commit and Push Baselines'
        env:
          # Disable Husky so lint-staged does not run during git commit and
          # leave the working tree dirty (which breaks git pull --rebase).
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SPEC="${{ github.event.inputs.spec || 'tests/e2e/glass-panel-surface.spec.ts' }}"
          SPEC_SHORT=$(basename "$SPEC" .spec.ts)

          # Stage snapshot directories (new .png files + any updates)
          # Use --ignore-errors so the command doesn't fail if a glob expands to nothing
          git add -- tests/e2e/*-snapshots/ 2>/dev/null || true
          # Also stage the spec (test.fixme markers have been removed)
          git add -- "$SPEC"

          if git diff --staged --quiet; then
            echo "No new or changed baselines — snapshots already up to date."
          else
            git commit -m "chore(e2e): generate Linux/chromium baselines + remove test.fixme for ${SPEC_SHORT} [skip ci]"

            git pull --rebase --autostash origin master
            # --no-verify: skip Husky pre-push Jest suite in CI
            git push --no-verify
            echo "Baselines committed and pushed."
          fi
