# Equoria Quality Gate Pipeline
# Generated by BMad TEA Agent — CI Workflow (2026-04-10)
# Stack: fullstack | Backend: Jest (Node ESM) | Frontend: Vitest | E2E: Playwright
#
# Fixes applied vs ci-cd.yml:
#   CI-01: seed:test step replaced — seedDatabase.mjs did not exist
#   CI-02: Node pinned to 22.x (matches current LTS; was 18.x)
#   CI-03: Coverage threshold gate added (70% branch/line minimum)
#   CI-04: Redis optional — ioredis mock covers all Jest tests
#   CI-05: Performance tests moved to non-blocking parallel job
#   CI-06: Integration tests no longer double-run with full suite
#
# Security: All ${{ inputs.* }} and unsafe ${{ github.event.* }} contexts
# are routed through env: intermediaries. See EXTENSION PATTERNS below.

# ─────────────────────────────────────────────────────────────────────────
# VERIFYING A CHANGE TO THIS WORKFLOW BEFORE IT REACHES master
# (Equoria-axyem.6 — full write-up in docs/devops-cicd.md)
# ─────────────────────────────────────────────────────────────────────────
# A workflow edit is not compiled, not imported, and covered by no test. The
# `verify_migration.js` step that referenced a deleted file ran broken on
# master for 18 days for exactly that reason. Two layers close it:
#
# 1. STATIC — `bash scripts/doctrine-checks/check-workflows-lint.sh` runs
#    actionlint over .github/workflows/. It is part of run-all.sh, so the
#    pre-push hook already runs it. It catches syntax errors, bad `${{ }}`
#    expressions, unknown step keys, and broken `needs:`/`runs-on:` refs.
#    It cannot catch a step that references a file which no longer exists.
#
# 2. DYNAMIC — actually run the edited workflow off master. This workflow
#    declares `workflow_dispatch:` above precisely so it can be:
#
#      git push origin <your-branch>
#      gh workflow run test.yml --ref <your-branch>
#      gh run list --branch <your-branch> --limit 5
#      gh run view <run-id>            # add --log-failed for the failing step
#
#    `--ref <your-branch>` runs the workflow FILE AS IT EXISTS ON THAT
#    BRANCH, so your edit is what executes. Delete the branch when done:
#      git push origin --delete <your-branch>
#
# Do BOTH before merging a workflow change. Static lint alone is what let
# the dead migration step through.
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# NEEDS GRAPH AND THE SKIP SENTINEL (Equoria-axyem.7 / Equoria-gvslq)
# ─────────────────────────────────────────────────────────────────────────
# 2026-09-14 (owner ruling, Equoria-axyem.7):
#   security-gate: needs [lint, db-preflight] -> [lint]
# 2026-10-28 (owner ruling q233, Equoria-zstml: the full check runs only on
# GitHub, so it must actually run): no test job waits for lint any more. From
# 2026-10-28 10:21 UTC every master run had Lint & Format red on one Prettier
# drift and therefore SKIPPED the whole backend matrix, the frontend suite and
# the security gate — the full suite had not run on master since. A lint
# failure stays red on its own job; it no longer hides test results.
#   lint, db-preflight, burn-in,
#   frontend-tests, performance-tests,
#   load-contention, security-gate      -> (no needs)
#   backend-tests                       -> [db-preflight]   (unmigrated DB = wasted run)
#   coverage-gate                       -> [backend-tests]
#   e2e-tests                           -> [backend-tests, frontend-tests]
#   production-build                    -> [coverage-gate, frontend-tests]
#   beta-readiness-gate                 -> [coverage-gate, security-gate,
#                                           frontend-tests]
#   deployment-gate                     -> [coverage-gate, security-gate,
#                                           beta-readiness-gate, e2e-tests,
#                                           production-build]
#   critical-jobs-ran (NEW)             -> all ten critical jobs, if: always()
#
# The `critical-jobs-ran` job ("Critical Jobs Ran") is the skip sentinel. A
# skipped job satisfies a required status check and renders grey, so a cascade
# of skips reads as "nothing to do". The sentinel FAILS, naming the jobs, when
# any critical job concluded `skipped` or `cancelled` on a run where its own
# `if:` said it should have executed. It does NOT fail merely because an
# upstream job failed — that is already red.
#
# HONEST LIMITATIONS — what the sentinel cannot see:
#   * `needs.backend-tests.result` is the matrix result AS A WHOLE. It reads
#     `skipped` only if the entire matrix was skipped. One shard skipped inside
#     a `fail-fast: false` matrix is invisible here.
#   * A job that never entered the graph at all (deleted, renamed, or typo'd
#     out of a `needs:` list) is not a skip and cannot be detected here;
#     `scripts/doctrine-checks/check-needs-references.mjs` covers that class.
#   * A step skipped INSIDE a job is invisible; only job-level results are read.
#   * Branch protection's list of required checks is repository configuration,
#     not workflow YAML. Adding "Critical Jobs Ran" to the required list is a
#     separate, owner-controlled action.
#
# The EXPECT_* mirrors are NOT self-enforcing YAML; they are kept honest by
# scripts/doctrine-checks/check-critical-jobs-mirrors.mjs, which fails if a
# mirror ever stops being character-identical to the `if:` it mirrors, or if a
# job checked as unconditional grows an `if:`.
# ─────────────────────────────────────────────────────────────────────────

name: 'Equoria Quality Gate'

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    # Weekly burn-in (flaky detection) — Sundays 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  # Equoria-sv0b: include `github.sha` so each commit's run is independent.
  # Without this, every push to master (or PR head) cancels the in-flight
  # run from the previous commit, killing the long-running e2e-tests job
  # mid-execution. With per-SHA groups: different commits → different groups
  # → no cross-commit cancellation. Same SHA re-pushed (rare: rebase + force-
  # push, webhook duplication, manual workflow_dispatch on same commit) →
  # same group → cancel-in-progress wins, avoiding double-runs.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/equoria_test'
  # validate-environment.mjs requires length>=32 + uppercase + lowercase + digit.
  JWT_SECRET: 'Test-JWT-Secret-For-CI-Minimum-32-Chars-Long-A1'
  JWT_REFRESH_SECRET: 'Test-Refresh-Secret-For-CI-Minimum-32-Chars-B2'
  NODE_ENV: 'test'
  # config/config.mjs requires PORT for the test profile (validator throws on
  # missing — Equoria-fefh2 recovery: this was the single root cause of all
  # 498 shard-2 suite-load failures + Performance/Load/Security job failures
  # on 2026-06-10 once lint stopped masking them). Local runs read .env.test.
  PORT: '3000'
  # MFA secret at-rest encryption (Equoria-yi13v) — mfa* suites 500 without a
  # key. Fixed 64-hex TEST key, no production meaning (Equoria-fefh2.36).
  FIELD_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  # Redis is disabled in test mode — no real Redis needed for tests
  # (cacheHelper.initializeRedis returns null when NODE_ENV=test;
  # rateLimiting: redisIntentionallyDisabled). The in-memory fallback is the tested path.
  REDIS_URL: 'redis://localhost:6379'

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint (backend + frontend, no DB required)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        # The root /eslint.config.js (flat config) imports @eslint/js and
        # typescript-eslint from root node_modules. ESLint walks up from
        # frontend/ when it runs and resolves these from root. Without this
        # install step, frontend ESLint fails with ERR_MODULE_NOT_FOUND for
        # @eslint/js.
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint — backend
        working-directory: ./backend
        run: npm run lint

      - name: ESLint — frontend
        working-directory: ./frontend
        # eslint is now in frontend/package.json devDependencies and resolves
        # via the lockfile (see commit 4ffa8316). Step is now hard-required.
        run: npm run lint

      - name: Prettier check — backend
        working-directory: ./backend
        run: npm run format:check

      - name: Prettier check — frontend
        working-directory: ./frontend
        # Frontend now has prettier in devDependencies and a format:check
        # script (see commit adding prettier dep). Hard-required.
        run: npm run format:check

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Database Preflight (migration validation)
  # ──────────────────────────────────────────────────────────────────────────────
  db-preflight:
    name: 'Database Migration Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/database/package-lock.json

      - name: Install database dependencies
        working-directory: ./packages/database
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./packages/database
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run migrations
        working-directory: ./packages/database
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Validate schema
        working-directory: ./packages/database
        run: npx prisma validate --schema=prisma/schema.prisma

      # Equoria-axyem.2 — restores, at the exact point the dead
      # `node migrations/verify_migration.js` step ran (removed by a22ac438f),
      # the coverage that deletion lost: a claim about the LIVE database rather
      # than about schema.prisma. `prisma validate` above checks the schema file
      # parses; this reads information_schema/pg_indexes/pg_constraint from the
      # database the step before just migrated, and compares them against the
      # catalog a fresh replay of the migration chain produces — failing on
      # drift in EITHER direction, across every table in `public`. It resolves
      # @prisma/client from packages/database, the only workspace this job
      # installs. See scripts/preflight/schema-drift.mjs and its sentinel,
      # backend/__tests__/scripts/liveSchemaDrift.sentinel.test.mjs.
      - name: Verify live schema matches the migration-applied structure
        run: node scripts/preflight/schema-drift.mjs

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Backend Tests, Sharded (3 shards × parallel)
  #
  # Tests are self-contained — each suite creates and cleans its own DB fixtures.
  # No seed step needed. Seeding for dev data is separate from test data.
  # Shard 1: tests/  (unit + service tests)
  # Shard 2: tests/integration/ + modules/**/__tests__/
  # Shard 3: __tests__/ (legacy location)
  # ──────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: 'Backend Tests (Shard ${{ matrix.shard }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Equoria-zstml: db-preflight only. A lint failure must not skip the suite.
    needs: [db-preflight]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard 1 — everything under tests/ except integration, plus
          # test files under models/, seed/, and the top-level backend/scripts/
          # + backend/eslint-plugins/ dirs. The old pattern anchored on $
          # so `tests/services/foo.test.mjs` never matched (only bare
          # `tests/foo.test.mjs` did), leaving 44 test files orphaned — this
          # was why dozens of services showed 0% coverage despite having
          # passing tests. The backend/(scripts|eslint-plugins)/ alternative is
          # anchored on `backend/` so it catches ONLY the top-level
          # scripts/eslint-plugins *.test.mjs (Equoria-axvnd: 4 files that
          # matched NO shard and never ran in CI) WITHOUT also grabbing the
          # backend/__tests__/scripts/ sentinels that shard 3 already owns.
          # Mutual exclusivity AND exhaustiveness are enforced by
          # ciShardExclusivity.sentinel.test.mjs + check-ci-shard-exclusivity.mjs.
          - shard: 1
            pattern: 'tests/(?!integration/)|(models|seed)/[^/]+\.test\.mjs$|backend/(scripts|eslint-plugins)/[^/]+\.test\.mjs$'
          # Shard 2 — integration tests + module co-located tests
          - shard: 2
            pattern: 'tests/integration|modules/(?!docs/__tests__/)(?!.*(?:groomSalaryPassScoped\.sentinel|flagEngineSingleSource\.sentinel|riderRetirementHidden\.integration)\.test\.mjs$).*/__tests__'
          # Shard 3 — legacy/top-level __tests__ dirs (largest volume),
          # EXCLUDING the module co-located modules/<x>/__tests__ suites that
          # shard 2 owns. The old bare '__tests__/' substring also matched every
          # modules/*/__tests__ path, so 469 module suites ran in BOTH shard 2
          # and shard 3 (Equoria-2ixd1): wasted CI minutes, coverage double-
          # counting in the merge gate, and — worst — two parallel matrix jobs
          # mutating the SAME suite's fixtures against the SHARED real DB (the
          # cross-job FK/isolation flake class run-suite-sharded.mjs avoids
          # serially). The negative lookahead drops anything under a
          # modules/.../__tests__/ path; `.*` (not `[^/]+`) also covers nested
          # module dirs (modules/<x>/<sub>/__tests__). Verified via jest
          # --listTests: 0 files match >1 shard after this change (was 469),
          # and 0 NEW orphans. Guarded by ciShardExclusivity.sentinel.test.mjs.
          # Equoria-rfv9j: shard 3 is the TREE set of backend/scripts/
          # tree-lane-plan.mjs (suites that plant files in, or walk, the shared
          # tree): backend/__tests__/ plus modules/docs/__tests__/ and the two
          # named module sentinels. It runs serially (serial: true selects
          # test:backend:ci:serial, one worker) because at --maxWorkers=2 a
          # planter and a scanner can run at the same moment, the race that
          # broke the local two-lane gate (WS4 S6). Guarded by
          # treeLanePinning.sentinel.test.mjs.
          - shard: 3
            pattern: '^(?!.*modules/.*/__tests__/).*__tests__/|modules/docs/__tests__/|modules/grooms/__tests__/groomSalaryPassScoped\.sentinel\.test\.mjs$|modules/traits/__tests__/flagEngineSingleSource\.sentinel\.test\.mjs$|modules/riders/__tests__/riderRetirementHidden\.integration\.test\.mjs$'
            serial: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            packages/database/package-lock.json

      - name: Install root dependencies
        # Backend Jest also runs sentinels over repo-root scripts, and those
        # resolve their imports from root node_modules, not backend/:
        # scripts/doctrine-checks/check-staff-routes-guarded.mjs imports
        # espree. Without this step its sentinel fails with "Cannot find
        # module 'espree'" (Equoria-5hdwr).
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install database dependencies
        working-directory: ./packages/database
        run: npm ci

      - name: Generate Prisma client + run migrations
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      # Equoria-fefh2.36: the real-DB doctrine made suites canonical-data-
      # coupled (e.g. breedCountSentinel asserts all 312 data/breeds rows with
      # shadeBias). A freshly migrated DB has zero breeds; seed the base data
      # then the full breed roster (both idempotent).
      - name: Seed canonical test data (base + 312-breed roster)
        working-directory: ./backend
        run: |
          npm run seed
          npm run seed:breeds

      - name: Run backend tests — shard ${{ matrix.shard }}
        working-directory: ./backend
        env:
          SHARD_PATTERN: ${{ matrix.pattern }}
          SHARD_SERIAL: ${{ matrix.serial }}
        run: |
          set -o pipefail
          # Security: SHARD_PATTERN passed through env: to prevent script injection
          # coverage reporters:
          #   - lcov: Codecov upload
          #   - json-summary: human-readable per-shard totals
          #   - json: coverage-final.json, required by `nyc merge` in Coverage Gate
          #
          # Heap management (Equoria-ac23): the CI invocation runs Jest directly
          # via `node ... jest.js`, which bypasses the `--max-old-space-size=8192`
          # flag set in backend/package.json's `test` script. Without it Node
          # defaults to ~4GB old-space — and shard 2 (395 suites with coverage
          # instrumentation) was hitting OOM/SIGTERM at heap ~3.8GB, surfacing
          # as worker-failed-to-exit-gracefully on whichever suites happened to
          # be last in the queue (breedController, memoryAdminGuard). Two
          # cooperating mitigations:
          #   1. --max-old-space-size=8192 — raise V8 old-space to 8GB, matching
          #      the local `npm test` invocation (ubuntu-latest runners have
          #      ≥16GB RAM, so this is well within budget).
          #   2. --workerIdleMemoryLimit=1500MB — Jest 29 auto-recycles a worker
          #      after a test file completes if its RSS exceeds the limit. This
          #      prevents cumulative bloat from leaking module caches, coverage
          #      counters, and Prisma client instances across hundreds of
          #      suites in a single worker.
          mkdir -p test-results
          jest_args=(
            --testPathPatterns="$SHARD_PATTERN"
            --coverage
            --coverageReporters=lcov
            --coverageReporters=json-summary
            --coverageReporters=json
          )
          # Serial shard (Equoria-rfv9j): test:backend:ci:serial is the same
          # command with --maxWorkers=1 (one recycled worker, one file at a
          # time). jest-cli rejects --runInBand beside --maxWorkers, so the
          # serial shard needs its own profile; it only lowers concurrency.
          if [ "$SHARD_SERIAL" = "true" ]; then
            npm run test:backend:ci:serial -- "${jest_args[@]}" 2>&1 | tee test-results/jest.log
          else
            npm run test:backend:ci -- "${jest_args[@]}" 2>&1 | tee test-results/jest.log
          fi

      - name: Summarize backend failure — shard ${{ matrix.shard }}
        if: failure()
        working-directory: ./backend
        run: node scripts/summarize-jest-results.mjs test-results/jest-results.json test-results/jest-summary.txt

      - name: Upload coverage — shard ${{ matrix.shard }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ./backend/coverage/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-shard-${{ matrix.shard }}
          path: ./backend/test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Coverage Gate (CI-03: enforce threshold)
  #
  # Merges coverage from all 3 shards and enforces 70% branch + line minimum.
  # Fail fast here rather than discovering gaps post-deploy.
  # ──────────────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: 'Coverage Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Download coverage — shard 1
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-1
          path: ./coverage-shard-1

      - name: Download coverage — shard 2
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-2
          path: ./coverage-shard-2

      - name: Download coverage — shard 3
        uses: actions/download-artifact@v8
        with:
          name: coverage-shard-3
          path: ./coverage-shard-3

      - name: Merge shard coverage and enforce threshold
        working-directory: ./backend
        run: |
          # Collect each shard's coverage-final.json into .nyc_output, then
          # merge with nyc and let nyc report enforce the thresholds declared
          # in backend/.nycrc.json (check-coverage: true → 85% lines/statements,
          # 80% branches/functions). Single source of truth for thresholds.
          mkdir -p .nyc_output merged-coverage
          for shard in 1 2 3; do
            SRC="../coverage-shard-${shard}/coverage-final.json"
            if [ -f "$SRC" ]; then
              cp "$SRC" ".nyc_output/coverage-shard-${shard}.json"
              echo "✓ Collected shard $shard coverage"
            else
              echo "⚠️ Missing $SRC"
              exit 1
            fi
          done
          npx nyc merge .nyc_output .nyc_output/merged.json
          # --reporter=text gives a readable per-file table in CI logs,
          # json-summary writes the structured summary Codecov consumes.
          npx nyc report \
            --reporter=text \
            --reporter=text-summary \
            --reporter=json-summary \
            --temp-dir=.nyc_output \
            --report-dir=./merged-coverage

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/merged-coverage
          flags: backend
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Frontend Tests
  # ──────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: 'Frontend Tests (Vitest)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Equoria-zstml: no needs. A lint failure must not skip the suite.

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        # Equoria-fefh2.28 (DoD-10b): the Vitest max-lines doctrine sentinels
        # (apiClientMaxLinesDoctrine, pagesMaxLinesDoctrine) spawn ESLint with
        # cwd=REPO_ROOT (spawnSync ... { cwd: REPO_ROOT }), which loads the
        # root flat eslint.config.js. That config imports @eslint/js and
        # typescript-eslint from root node_modules. Without this step the
        # spawned ESLint crashes with ERR_MODULE_NOT_FOUND for @eslint/js and
        # the sentinels error out instead of asserting. Mirrors the lint job's
        # root-dep install (above).
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Chromium (required by storybook vitest project)
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Vitest with coverage
        working-directory: ./frontend
        # Equoria-zzlh (2026-05-04): removed continue-on-error: true. The
        # original "97/231 failing" comment was stale — actual baseline was
        # 8 failing files from two distinct bugs:
        #   - activity-utils.ts and statistics-utils.ts had `_`-prefixed
        #     enum members (unused-var lint sweep applied incorrectly to
        #     enum declarations, breaking the enum API for both consumers
        #     and tests)
        #   - ScoreBreakdownChart.test.tsx mock factory variables had `_`
        #     prefix on `const` declarations while assignment sites kept
        #     the unprefixed names
        # Plus 3 mock-setup bugs (App.story-8-1, OnboardingPage,
        # EmptyState) where vi.mock factories omitted exports the source
        # had since added (Footprints, Tooltip, advanceOnboarding hoist).
        # vitest.config.ts testTimeout bumped 10s → 20s for jsdom 4-fork
        # contention headroom. Suite now 243/243 green.
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ./frontend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 6 — E2E Tests (Playwright, master + PRs only)
  #
  # Note: R-03 from TD — breeding.spec.ts has try/catch flow control that swallows
  # assertion failures. This job will show green even for that spec until R-03 is fixed.
  # ──────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: 'E2E Tests (Playwright)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    # Equoria-jz9v2: raise the global apiLimiter ceiling for THIS E2E job only.
    # The backend runs NODE_ENV=beta (playwright.config.ts) with the REAL
    # rate-limit middleware + Redis (Equoria-obwp intent, preserved). The whole
    # Playwright suite (~27 min) hits the backend from ONE CI IP, exceeding the
    # beta apiLimiter default (RATE_LIMIT_MAX_BY_ENV.beta = 3000 / 15 min, sized
    # for a ~7-min suite) within the rolling 15-min window → 429 cascade fails
    # unrelated specs. This EXPLICIT override (honored only in non-prod, only
    # when set — resolveE2eRateLimitMax in backend/middleware/e2eRateLimitOverride.mjs)
    # gives the CI suite headroom WITHOUT changing RATE_LIMIT_MAX_BY_ENV, so no
    # real deploy's posture changes (betaReadinessEnvSentinel still pins beta
    # 3000 / prod 100). 100000 / 15 min ≈ 111 req/s — ~33× the beta default:
    # ample room for the suite to grow (plus retry amplification) while staying
    # a FINITE, firing ceiling (a runaway client is still throttled), NOT a
    # bypass/disable. The backend server (spawned by Playwright's webServer,
    # which inherits process.env) reads this at boot; scoped to the e2e-tests
    # job so the Beta Readiness Gate and unit-test jobs are untouched.
    env:
      E2E_RATE_LIMIT_MAX: '100000'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Equoria-obwp: provision Redis for the E2E backend (NODE_ENV=beta in
      # playwright.config.ts → real rate-limit middleware path). Without a
      # Redis service the limiter falls back to in-memory mode and the
      # in-process counter accumulates across all 130 sequential Playwright
      # tests in one chromium worker, eventually tripping the 500/15min
      # registration cap and 429-ing the remainder of the run. With Redis
      # available the limiter uses RedisStore and counters reset cleanly per
      # window — beta-critical-path, breeding, onboarding-flow, session-
      # lifetime, and settings-persistence specs no longer share rate-limit
      # state through a leaky in-memory bucket. Bypass headers are explicitly
      # disabled under NODE_ENV=beta (see backend/middleware/rateLimiting.mjs
      # Story 21S-2), so Redis is the only correct fix — raising the cap via
      # TEST_RATE_LIMIT_MAX_REQUESTS would not apply (those env knobs only
      # take effect under NODE_ENV=test or JEST_WORKER_ID).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install all dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../packages/database && npm ci

      - name: Setup database
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed minimum test data (breeds)
        # tests/e2e/global-setup.ts opens /onboarding and selects index 1 of
        # the breed-select dropdown. A freshly migrated DB has zero breeds,
        # so the select renders only the placeholder and the locator times
        # out. seedDatabase.mjs idempotently inserts the 5 canonical breeds
        # the UI needs to render a real choice. Equoria-3iyk Phase 1b.
        working-directory: ./backend
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Playwright E2E tests
        env:
          BASE_URL: 'http://localhost:3000'
        # `playwright install` above only fetches chromium binaries — firefox
        # and webkit projects in playwright.config.ts would fail with
        # 'browser not installed' instantly (3-4ms) under the default invocation.
        # Restrict the run to the chromium project to match what's actually
        # installed. Cross-browser coverage is a separate concern; if it's
        # added back, install the other browsers above.
        run: npx playwright test --project=chromium

      # Equoria-yhg0g (UX spec 13.4): automated accessibility gate.
      # Separate Playwright project (`a11y`) so it is a distinct, named
      # step — the main E2E lane result above stays independently
      # readable. This step is a real blocking gate (no continue-on-error):
      # it fails the job
      # if any covered beta surface has a critical/serious axe violation.
      # `if: always()` so it still runs even if a non-a11y E2E spec above
      # flaked, keeping the a11y signal independent of the main lane.
      - name: Run Accessibility (axe) E2E gate
        if: always()
        env:
          BASE_URL: 'http://localhost:3000'
        run: npx playwright test --project=a11y

      - name: Upload Playwright report on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 7 — Performance Tests
  #
  # Was non-blocking ("Performance Tests (non-blocking)") while
  # seedPerformanceData.mjs accumulated schema drift that crashed the seed
  # step. Chunk-B code-review fix (2026-04-30) modernized the seed against
  # the current schema (Show.runDate, CompetitionResult.placement String,
  # Horse top-level stats, etc.) — the seed now runs cleanly and a real perf
  # regression should block merge, which is the correct contract for a job
  # named "Performance Tests."
  # ──────────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: 'Performance Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Equoria-zstml: no needs. A lint failure must not skip these tests.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            packages/database/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../packages/database && npm ci

      - name: Setup database
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed performance data
        working-directory: ./backend
        # The perf seed picks a random breed via prisma.breed.findMany();
        # it just needs ANY breed to exist. `npm run seed` inserts 5
        # canonical breeds in ~5s, vs `npm run seed:breeds` which loads
        # 310 SQL files via $executeRawUnsafe and was taking 15+ min on CI
        # — long enough to blow the 20-min job timeout. Random selection
        # over 5 breeds is functionally identical to selection over 310
        # for performance testing purposes (we don't exercise breed-
        # specific code paths in the perf tests).
        run: |
          npm run seed
          npm run seed:performance

      - name: Run performance tests
        working-directory: ./backend
        run: npm run test:performance

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: ./backend/performance-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 7b — Load Contention (advisory, Equoria-fx5cb / k8t5 follow-up)
  #
  # One real load probe for the concurrent feed+breed+foal contention class
  # (Equoria-zvp4 / k8t5):
  #
  #   bulk-foaling-cron driver — imports and invokes the REAL
  #   runFoalingJob() (the exact entrypoint the nightly cron
  #   runFoalingJobScheduled uses) CONCURRENTLY against scoped throwaway
  #   in-foal mares. Asserts the no-double-create invariant.
  #
  # A k6 SMOKE harness used to run here too, driving parallel foal-now bursts
  # at one in-foal mare through POST /horses/:id/foal-now. That route was a
  # gestation bypass in the production router and is deleted (Equoria-6nl3j),
  # so the harness and its backgrounded-server steps are gone. The mutation-vs-
  # mutation double-foal window it gated is pinned deterministically in
  # backend/modules/horses/__tests__/foalNowConcurrentClaim.test.mjs (N
  # concurrent createFoalFromPregnancy calls yield exactly one foal).
  #
  # ADVISORY by job topology: NO other job lists this in `needs`, and
  # `deployment-gate` does not depend on it — a red result here does NOT
  # block merge/deploy. But it is NOT `continue-on-error`: a live race makes
  # the driver exit non-zero and the JOB goes red so the signal is visible
  # (advisory means the job does not gate, not that failures are hidden).
  # The driver emits a JSON artifact.
  # ──────────────────────────────────────────────────────────────────────────────
  load-contention:
    name: 'Load Contention (advisory)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Equoria-zstml: no needs. A lint failure must not skip this job.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            packages/database/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../packages/database && npm ci

      - name: Setup database
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed canonical breeds
        # The bulk-cron driver selects a breed whose name is a
        # breedProfiles.json key (createFoalFromPregnancy requires a
        # profile). seedDatabase.mjs idempotently inserts the canonical
        # breeds, several of which have profiles.
        working-directory: ./backend
        run: |
          npm run seed
          npm run seed:breeds

      - name: Run bulk-foaling-cron contention driver (real cron path)
        # Drives the REAL runFoalingJob() concurrently — not a no-op:
        # asserts no mare double-foals across parallel sweeps. Exits
        # non-zero (=> red job) if the cron double-create race is live.
        # Uses the job-level env (DATABASE_URL etc.) — no --env-file needed
        # since the workflow `env:` block already exports them.
        working-directory: ./backend
        run: node tests/load/run-bulk-foaling-cron.mjs

      - name: Upload load-contention artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-contention-results
          path: |
            ./backend/load-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 8 — Security Gate (blocking)
  #
  # P0 hardening policy:
  # - Dependency audit is blocking at high severity
  # - Backend security suite is blocking
  # - Environment validation is blocking
  # ──────────────────────────────────────────────────────────────────────────────
  security-gate:
    name: 'Security Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Equoria-axyem.7 (owner ruling 2026-09-14): needs [lint] ONLY, no longer
    # [lint, db-preflight]. This job provisions its own postgres service and
    # runs its own `prisma migrate deploy` + seed below, so it never consumed
    # anything db-preflight produced — the edge was pure ordering. Its cost was
    # that a migration-check failure silently SKIPPED the security gate, so a
    # database problem hid a security problem for 18 days. Accepted trade-off:
    # the security gate now spends a few minutes on runs that are already
    # failing. backend-tests deliberately KEEPS `needs: [db-preflight]` —
    # testing against an unmigrated database is wasted time, not hidden signal.
    # Equoria-zstml (owner ruling q233, 2026-10-28): the [lint] edge went too,
    # for the same reason — one Prettier drift skipped this gate on every
    # master run from 2026-10-28 10:21 UTC.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/database/package-lock.json

      - name: Install root dependencies
        # test:security runs sentinels over repo-root scripts, which resolve
        # their imports (e.g. espree in check-staff-routes-guarded.mjs) from
        # root node_modules. See the backend-tests job (Equoria-5hdwr).
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install database dependencies
        working-directory: ./packages/database
        run: npm ci

      - name: Generate Prisma client + run migrations
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      # Equoria-fefh2.36: same canonical-data parity as backend-tests.
      - name: Seed canonical test data (base + 312-breed roster)
        working-directory: ./backend
        run: |
          npm run seed
          npm run seed:breeds

      - name: Validate environment policy
        working-directory: ./backend
        run: npm run validate-env

      - name: Run backend security suite
        working-directory: ./backend
        run: npm run test:security

      - name: Audit-allowlist sentinel — prove expiry check fires (Equoria-e7l2)
        # Mirror of the ci-cd.yml sentinel. Plants an expired allowlist
        # entry, asserts the audit script exits 3. Catches expiry-check
        # regression before the real audit runs.
        run: |
          set -uo pipefail
          SENTINEL_ALLOWLIST=$(mktemp --suffix=.json)
          cat > "$SENTINEL_ALLOWLIST" <<'EOF'
          {"allowlist":[{"id":"GHSA-doctrine-sentinel","justification":"sentinel: intentionally past expiry to prove the gate fires","expires":"2020-01-01"}]}
          EOF
          set +e
          node scripts/audit-with-allowlist.mjs ./backend high "$SENTINEL_ALLOWLIST" > /dev/null 2>&1
          actual_exit=$?
          set -e
          rm -f "$SENTINEL_ALLOWLIST"
          if [ "$actual_exit" != "3" ]; then
            echo "SENTINEL FAIL: expected exit 3 from expired allowlist; got $actual_exit."
            exit 1
          fi
          echo "Sentinel OK: expiry check fires."

      - name: npm audit — backend (blocking with allowlist)
        # Equoria-e7l2 (21R-CI-3): replaced raw `npm audit --audit-level=
        # moderate` with expiry-tracked-allowlist wrapper. See
        # scripts/audit-with-allowlist.mjs for gate logic.
        run: node scripts/audit-with-allowlist.mjs ./backend high

      - name: npm audit — frontend (blocking with allowlist)
        run: node scripts/audit-with-allowlist.mjs ./frontend high

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 9 — Production Build Validation (master only)
  #
  # Equoria-6q7cf (2026-09-30): replaces the former `docker-build` job. The
  # repository-managed Dockerfile is gone; Railway builds with Railpack and
  # runs the same `npm run build:production` (scripts/build-production.mjs)
  # this job runs: backend/database/frontend installs, Prisma generate, Vite
  # build, required-asset verification. Any failed stage fails the job, and
  # the Deployment Gate and skip sentinel below both depend on it.
  # ──────────────────────────────────────────────────────────────────────────────
  production-build:
    name: 'Production Build Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [coverage-gate, frontend-tests]
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/database/package-lock.json

      - name: Run the canonical production build
        env:
          NODE_ENV: production
        run: npm run build:production

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 9.5 — Beta Readiness Gate (runs on EVERY event)
  #
  # Equoria-axyem.7: this header said "master only" for a long time and was
  # simply wrong — the job has no `if:` and never has. The skip sentinel
  # (`critical-jobs-ran`) therefore treats it as unconditional, and
  # scripts/doctrine-checks/check-critical-jobs-mirrors.mjs FAILS if it ever
  # gains an `if:` without a matching EXPECT_* mirror in the sentinel.
  #
  # CI-runnable production-parity readiness lane:
  # - static scans (cleanup routes, DB mocks, frontend mocks, bypass headers)
  # - full Playwright readiness suite against live backend + frontend + Postgres
  # This replaces the old "local-only signoff" assumption with reproducible CI
  # evidence for beta readiness.
  # ──────────────────────────────────────────────────────────────────────────────
  beta-readiness-gate:
    name: 'Beta Readiness Gate'
    runs-on: ubuntu-latest
    # Equoria-k5e0 (21R-CI-6): raised from 35 to 55 minutes. The old cap was
    # tight on cold-cache runs: npm ci × 4 (~8-12 min cold), Playwright
    # install cold (~3-5 min), Playwright suite (~5-10 min) totals ~26-30 min
    # which leaves only ~5 min of headroom at 35. Playwright browsers are
    # already cached via the 'Cache Playwright browsers' step; a warm-cache
    # run completes in ~18-22 min (<40% of the new cap).
    timeout-minutes: 55
    needs: [coverage-gate, security-gate, frontend-tests]

    # Equoria-rrpw (21R-CI-4): override the workflow-level `NODE_ENV: test`
    # for the readiness lane. Mirrors the same fix in ci-cd.yml; see that
    # workflow for full rationale. Job-level `env` overrides workflow-
    # level per GitHub Actions precedence.
    env:
      NODE_ENV: 'beta-readiness'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Assert NODE_ENV is beta-readiness (Equoria-rrpw / 21R-CI-4)
        # Sentinel for the job-level env override above. Mirrors ci-cd.yml.
        # Catches regressions that would silently restore the workflow-
        # level `NODE_ENV: test` value, putting readiness evidence under
        # the wrong profile.
        run: |
          echo "NODE_ENV=$NODE_ENV"
          if [ "$NODE_ENV" != "beta-readiness" ]; then
            echo "FAIL: expected NODE_ENV=beta-readiness in this job; got '$NODE_ENV'."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            packages/database/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install all dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../packages/database && npm ci

      - name: Setup database
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed breeds (required for onboarding flow)
        # The beta-readiness Playwright suite includes
        # tests/e2e/readiness/auth-onboarding.spec.ts which selects a breed
        # from the BreedSelector dropdown via selectOption({ index: 1 }).
        # The dropdown is populated from GET /api/breeds, which returns
        # whatever's in the breeds table — empty in a fresh CI test DB.
        # Without breed seeding the test times out waiting for option 1.
        #
        # Use `npm run seed` (5 canonical breeds, ~5s) NOT seed:breeds
        # (310 SQL files via $executeRawUnsafe, 15+ min — blows the
        # 35-min job timeout per the comment in ci-cd.yml line 323).
        # Five breeds are enough to populate the dropdown.
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/equoria_test
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Beta-readiness static scans (shared library)
        # Equoria-iffbt / ADR-010: the four cheap static scans are defined ONCE
        # in scripts/lib/beta-readiness-scans.sh and sourced by BOTH this CI job
        # and the canonical signoff script scripts/check-beta-readiness.sh.
        # There is no longer an inline copy of the scan regexes here, so the
        # script and CI cannot drift. Each sentinel function plants a known
        # violation, asserts the matching scan FIRES (OPTIMAL_FIX_DISCIPLINE §2),
        # then cleans up. The production scans run after the sentinels.
        run: |
          set -uo pipefail
          source scripts/lib/beta-readiness-scans.sh

          # Sentinel-positive self-tests first: prove the scans still gate.
          equoria_scan_sentinel_frontend_mock_data || { echo "Frontend mock-data sentinel FAILED"; exit 1; }
          equoria_scan_sentinel_bypass_headers || { echo "Bypass-header sentinel FAILED"; exit 1; }
          echo "Sentinels OK: mock-data and bypass-header scans catch planted violations and clean up."

          # Production scans (any non-zero return blocks the gate).
          equoria_scan_http_cleanup_routes || exit 1
          equoria_scan_integration_db_mocks || exit 1
          equoria_scan_frontend_mock_data || exit 1
          equoria_scan_bypass_headers || exit 1
          echo "All four beta-readiness static scans passed."

      - name: Run beta-readiness Playwright suite
        run: npm run test:e2e:beta-readiness

      - name: Upload beta-readiness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta-readiness-artifacts
          path: |
            playwright-report/beta-readiness/
            test-results/beta-readiness/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 10 — Deployment Gate (master only)
  # Blocks on: coverage-gate, security-gate, beta-readiness-gate, e2e-tests, production-build
  # Does NOT block on: performance-tests
  # ──────────────────────────────────────────────────────────────────────────────
  deployment-gate:
    name: 'Deployment Gate'
    runs-on: ubuntu-latest
    needs: [coverage-gate, security-gate, beta-readiness-gate, e2e-tests, production-build]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: All gates passed
        run: |
          echo "## 🚀 Equoria Deployment Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Doctrine Gate | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Migration | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests (3 shards) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage ≥ 70% | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gate | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Beta Readiness Gate | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Advisory (non-blocking): Performance tests_" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Ready for Railway deployment"

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 11 — Burn-In (weekly flaky detection, schedule-triggered only)
  #
  # Targets E2E specs. Runs 3 iterations to catch timing-dependent failures.
  # R-03 note: breeding.spec.ts try/catch swallows failures — burn-in will not
  # detect those until R-03 is fixed (Epic 21 story 21-4).
  # ──────────────────────────────────────────────────────────────────────────────
  burn-in:
    name: 'Burn-In (Flaky Detection)'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule'

    # Equoria-cgx4h: this job must boot the SAME backend the e2e-tests job
    # boots, because it runs the same Playwright suite. Until 2026-10-23 it
    # did not: no Redis service (the beta-profile backend retried a refused
    # connection forever, registration never completed, and global-setup died
    # after 30 s in every iteration; run 36302474181 logged 435 ECONNREFUSED
    # lines and 5 "Global setup failed", run 39104999379 the same signature),
    # no E2E_RATE_LIMIT_MAX, and no --project, so firefox and webkit were
    # selected although only chromium is installed. See the e2e-tests job for
    # the full rationale of each setting.
    env:
      E2E_RATE_LIMIT_MAX: '100000'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: equoria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            packages/database/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install all dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../packages/database && npm ci

      - name: Setup database
        working-directory: ./packages/database
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed minimum test data (breeds)
        # tests/e2e/global-setup.ts opens /onboarding and selects index 1 of
        # the breed-select dropdown. A freshly migrated DB has zero breeds,
        # so the select renders only the placeholder and the locator times
        # out. seedDatabase.mjs idempotently inserts the 5 canonical breeds
        # the UI needs to render a real choice. Equoria-3iyk Phase 1b.
        working-directory: ./backend
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Equoria-cgx4h: three iterations, not five. One e2e-tests job (setup
      # plus one chromium pass) took 15 to 25 minutes wall across ten runs
      # between 2026-10-20 and 2026-10-22; the Playwright step alone was 13.5
      # minutes in the one inspected in detail. Five passes are about 68
      # minutes before the Jest step starts, which is why six scheduled runs
      # between 2026-05-03 and 2026-07-05 were cancelled at the 60-minute job
      # timeout. Three passes plus setup fit inside it with the Jest step; the
      # timeout itself is NOT raised. A failed pass now fails the job (a
      # burn-in exists to surface exactly that), where it used to tolerate one
      # failure in five.
      - name: Burn-in E2E — 3 iterations
        env:
          BASE_URL: 'http://localhost:3000'
        run: |
          echo "🔥 Starting E2E burn-in — flaky test detection"
          FAILURES=0
          for i in 1 2 3; do
            echo "━━━ Iteration $i/3 ━━━"
            if ! npx playwright test --project=chromium --reporter=line; then
              FAILURES=$((FAILURES + 1))
              echo "⚠️ Iteration $i failed"
            fi
          done
          echo "Burn-in complete — $FAILURES/3 iterations failed"
          if [ "$FAILURES" -gt 0 ]; then
            echo "❌ Flaky threshold exceeded (any failure in 3 runs)"
            exit 1
          fi
          echo "✅ Burn-in passed"

      - name: Burn-in — Jest integration suite (parallel isolation check)
        working-directory: ./backend
        run: |
          echo "🔥 Backend parallel isolation burn-in — 3 iterations"
          FAILURES=0
          for i in {1..3}; do
            echo "━━━ Iteration $i/3 ━━━"
            if ! node --experimental-vm-modules node_modules/jest/bin/jest.js \
                tests/integration/ --forceExit --no-coverage; then
              FAILURES=$((FAILURES + 1))
              echo "⚠️ Iteration $i failed"
            fi
          done
          echo "Backend burn-in — $FAILURES/3 iterations failed"
          if [ "$FAILURES" -gt 0 ]; then
            echo "❌ Backend integration tests have parallel isolation issues"
            exit 1
          fi

      - name: Upload burn-in failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-failures-${{ github.run_id }}
          path: |
            playwright-report/
            backend/test-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 12 — Critical Jobs Ran (skip sentinel; Equoria-axyem.7 / Equoria-gvslq)
  #
  # A skipped job satisfies a required status check and renders as a grey box,
  # so a cascade of skips downstream of one failure looked, for 18 days, like a
  # pipeline that simply had nothing to do. This job makes non-execution RED.
  #
  # Contract:
  # - Runs with `if: always()`, so it reports even when upstream jobs failed.
  # - FAILS only when a critical job concluded `skipped` or `cancelled` on a run
  #   where that job was supposed to execute. It does NOT fail merely because an
  #   upstream job failed — a failure is already red and already blocks.
  # - Conditionally-gated jobs (e2e-tests on master/PR only; production-build and
  #   deployment-gate on master only) are exempt on runs where their own `if:`
  #   legitimately excludes them. The EXPECT_* expressions below MUST be kept
  #   identical to those jobs' `if:` conditions —
  #   scripts/doctrine-checks/check-critical-jobs-mirrors.mjs enforces that.
  # - Advisory jobs (performance-tests, load-contention) and the schedule-only
  #   burn-in are deliberately NOT critical: the workflow already declares them
  #   non-blocking and the Deployment Gate does not block on them.
  # ──────────────────────────────────────────────────────────────────────────────
  critical-jobs-ran:
    name: 'Critical Jobs Ran'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - db-preflight
      - backend-tests
      - coverage-gate
      - frontend-tests
      - security-gate
      - beta-readiness-gate
      - e2e-tests
      - production-build
      - deployment-gate

    steps:
      - name: Fail loudly if a critical job did not run
        env:
          R_LINT: ${{ needs.lint.result }}
          R_DB_PREFLIGHT: ${{ needs.db-preflight.result }}
          R_BACKEND_TESTS: ${{ needs.backend-tests.result }}
          R_COVERAGE_GATE: ${{ needs.coverage-gate.result }}
          R_FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          R_SECURITY_GATE: ${{ needs.security-gate.result }}
          R_BETA_READINESS: ${{ needs.beta-readiness-gate.result }}
          R_E2E: ${{ needs.e2e-tests.result }}
          R_PRODUCTION_BUILD: ${{ needs.production-build.result }}
          R_DEPLOYMENT_GATE: ${{ needs.deployment-gate.result }}
          # Mirrors of the conditional jobs' own `if:` expressions.
          EXPECT_E2E: ${{ github.ref == 'refs/heads/master' || github.event_name == 'pull_request' }}
          EXPECT_MASTER_ONLY: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -uo pipefail

          MISSING=''
          ROWS="$RUNNER_TEMP/critical-jobs-rows.md"
          : > "$ROWS"

          check() {
            name="$1"
            result="$2"
            expected="$3"
            if [ "$expected" != 'true' ]; then
              echo "  $name: $result (exempt on this run by its own if: condition)"
              printf '| %s | %s | not required on this run |\n' "$name" "$result" >> "$ROWS"
              return 0
            fi
            case "$result" in
              skipped | cancelled)
                echo "  $name: $result   <-- CRITICAL JOB DID NOT RUN"
                printf '| %s | **%s** | DID NOT RUN |\n' "$name" "$result" >> "$ROWS"
                MISSING="${MISSING}${MISSING:+, }${name} (${result})"
                ;;
              *)
                echo "  $name: $result"
                printf '| %s | %s | ran |\n' "$name" "$result" >> "$ROWS"
                ;;
            esac
          }

          echo 'Critical job results for this run:'
          check lint                "$R_LINT"            true
          check db-preflight        "$R_DB_PREFLIGHT"    true
          check backend-tests       "$R_BACKEND_TESTS"   true
          check coverage-gate       "$R_COVERAGE_GATE"   true
          check frontend-tests      "$R_FRONTEND_TESTS"  true
          check security-gate       "$R_SECURITY_GATE"   true
          check beta-readiness-gate "$R_BETA_READINESS"  true
          check e2e-tests           "$R_E2E"             "$EXPECT_E2E"
          check production-build    "$R_PRODUCTION_BUILD" "$EXPECT_MASTER_ONLY"
          check deployment-gate     "$R_DEPLOYMENT_GATE" "$EXPECT_MASTER_ONLY"

          {
            echo '## Critical Jobs Ran'
            echo ''
            echo '| Job | Result | Verdict |'
            echo '|---|---|---|'
            cat "$ROWS"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$MISSING" ]; then
            {
              echo "**FAILED - critical jobs did not run:** $MISSING"
              echo ''
              echo 'A skipped required job is not a pass. Fix the upstream failure that'
              echo 'caused the cascade, or change the gating if the skip was intended.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Critical jobs did not run::$MISSING"
            echo "CRITICAL JOBS DID NOT RUN: $MISSING"
            exit 1
          fi

          echo '**All critical jobs executed.**' >> "$GITHUB_STEP_SUMMARY"
          echo 'All critical jobs executed (pass or fail, none skipped).'

# ============================================================================
# EXTENSION PATTERNS — Script Injection Prevention
# ============================================================================
# When extending with workflow_call or workflow_dispatch, NEVER pass
# ${{ inputs.* }} directly into run: blocks. Always route through env:.
# Inputs must be DATA, not COMMANDS.
#
# ✅ SAFE:
#   - name: Run filtered tests
#     env:
#       TEST_GREP: ${{ inputs.test-grep }}
#     run: |
#       # Security: inputs passed through env: to prevent script injection
#       npx playwright test --grep "$TEST_GREP"
#
# ❌ NEVER:
#   - run: npx playwright test --grep "${{ inputs.test-grep }}"
#   - env:
#       CMD: ${{ inputs.install-command }}
#     run: $CMD
# ============================================================================
