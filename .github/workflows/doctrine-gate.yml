name: Doctrine Gate

# Equoria-5nqe (B1): runs scripts/doctrine-checks/run-all.sh on every PR
# and on master pushes. The suite is the machine-checked enforcement of
# CLAUDE.md / 21R Beta Readiness Doctrine / EDGE_CASE_FIX_DISCIPLINE rules.
# Each script aggregates one rule; failure of any script fails the gate.
#
# Activation as a merge-blocker requires a branch-protection rule on master
# that requires this job. The job runs and reports today even before that
# toggle is set so contributors see the result on PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: doctrine-gate-${{ github.ref }}
  cancel-in-progress: true # doctrine-allow: workflow-cancel-shortrun (Equoria-sv0b: this gate is ~1 min, cancellation harmless)

jobs:
  doctrine-gate:
    name: Doctrine Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Equoria-fefh2.27: check-backend-lint-and-format.mjs runs the real
      # backend eslint + prettier, so the doctrine job needs backend deps.
      # Cached install ~30-60s; the alternative (skipping the check when deps
      # are missing) is the forbidden graceful-skip pattern.
      #
      # Root deps too (2026-06-12): frontend ESLint's flat-config discovery
      # walks up to the repo-root eslint.config.js, which imports @eslint/js
      # from the ROOT node_modules — same environment CI's Lint & Format job
      # has. Without it the frontend lint stage crashes ERR_MODULE_NOT_FOUND.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend

      # Equoria-fefh2.27 widening (2026-06-12): the lint-and-format check now
      # mirrors the FRONTEND CI lint steps too, so frontend deps are needed —
      # the check hard-fails (correctly, no graceful skip) when they're absent.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      # Equoria-axyem.6: check-workflows-lint.sh hard-fails when actionlint
      # is absent (a doctrine check that skips when its tool is missing is the
      # silent-skip pattern this epic exists to remove), so the gate job must
      # install it. Pinned to the same version the check enforces as its floor.
      # Installed from the official release tarball — no new npm dependency and
      # no third-party action.
      #
      # The tarball is verified against the sha256 published in
      # actionlint_1.7.12_checksums.txt for tag v1.7.12. A release asset is
      # mutable by its owner, so a tag pin alone would let a replaced asset
      # execute unchecked on the gate runner. The digest is inlined here
      # rather than fetched, because fetching the checksum file from the same
      # mutable release would verify nothing. Bump BOTH values together.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download"
          url="$url/v${ACTIONLINT_VERSION}/${asset}"
          curl -sSfL --retry 3 --retry-delay 5 -o "$dir/$asset" "$url"
          echo "${ACTIONLINT_SHA256}  $dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir" actionlint
          "$dir/actionlint" --version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run doctrine-checks suite
        run: bash scripts/doctrine-checks/run-all.sh
